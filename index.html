<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혈당도둑</title>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#111111',
                        canvas: '#ffffff',
                        'soft-cloud': '#f5f5f5',
                        mute: '#707072',
                        hairline: '#cacacb',
                        'hairline-soft': '#e5e5e5',
                        sale: '#d30005',
                        success: '#007d48',
                        info: '#1151ff'
                    },
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #e5e5e5; margin: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-wrapper { display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 768px; background: #ffffff; min-height: 100vh; position: relative; padding-bottom: 70px; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .tab-content { animation: fadeIn 0.2s ease-in-out; flex: 1; display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-press:active { transform: scale(0.96); opacity: 0.8; transition: all 0.1s; }
        .chat-scroll { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div id="root" class="app-wrapper"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HomeIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const ChatIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>;
        const UserIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const SendIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
        const SaveIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;

        const loadData = (key, defaultData) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultData;
        };

        const MEAL_TYPES = ['아침', '오전 간식', '점심', '오후 간식', '저녁', '야식'];

        function App() {
            const [currentTab, setCurrentTab] = useState('home');
            
            // 전역 상태 (새로운 키 버전으로 충돌 방지)
            const [records, setRecords] = useState(() => loadData('bst_food_records', []));
            const [profile, setProfile] = useState(() => loadData('bst_profile_v2', { age: 24, height: 168, weight: '' }));
            const [foodDB, setFoodDB] = useState(() => loadData('bst_foodDB_v2', {
                good: ['천연발효 사워도우', '사워도우', '르방', '새우장', '연어장', '바질', '닭가슴살', '현미밥', '채소', '토마토', '계란', '오이'],
                bad: ['액상과당', '음료', '빵', '믹스커피', '떡볶이', '과자', '아이스크림', '당', '초콜릿', '라면']
            }));
            const [chatMessages, setChatMessages] = useState(() => loadData('bst_chat_v2', [
                { sender: 'ai', text: '안녕하세요! 매 끼니마다 식단을 기록해주시면, 혈당 개선에 좋은 음식인지 분석하고 조언해 드릴게요 😊' }
            ]));

            // 입력 폼 상태
            const [mealType, setMealType] = useState('아침');
            const [inputValue, setInputValue] = useState('');
            const [chatInput, setChatInput] = useState('');
            const [newGood, setNewGood] = useState('');
            const [newBad, setNewBad] = useState('');
            
            const [saveToast, setSaveToast] = useState(false);
            const inputRef = useRef(null);
            const chatEndRef = useRef(null);

            // 데이터 자동 백업
            useEffect(() => {
                localStorage.setItem('bst_food_records', JSON.stringify(records));
                localStorage.setItem('bst_profile_v2', JSON.stringify(profile));
                localStorage.setItem('bst_foodDB_v2', JSON.stringify(foodDB));
                localStorage.setItem('bst_chat_v2', JSON.stringify(chatMessages));
                
                setSaveToast(true);
                const timer = setTimeout(() => setSaveToast(false), 1500);
                return () => clearTimeout(timer);
            }, [records, profile, foodDB, chatMessages]);

            // 스크롤 하단 이동
            useEffect(() => {
                if(currentTab === 'chat' && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [chatMessages, currentTab]);

            // --- 홈 탭 기능 (추가/수정/삭제) ---
            const handleAddRecord = (e) => {
                e.preventDefault();
                if (!inputValue) return alert('섭취한 식단을 입력해주세요.');
                
                const newRecord = { 
                    id: Date.now(), 
                    mealType: mealType, 
                    value: inputValue, 
                    date: new Date().toLocaleDateString(),
                    timestamp: new Date().getTime()
                };
                
                // 시간순 정렬 대신 입력된 순서(id/timestamp) 기반 유지
                setRecords([...records, newRecord].sort((a, b) => a.timestamp - b.timestamp));
                
                setInputValue('');
                if (inputRef.current) inputRef.current.focus();
            };

            const editRecord = (record) => {
                setMealType(record.mealType);
                setInputValue(record.value);
                setRecords(records.filter(r => r.id !== record.id));
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (inputRef.current) inputRef.current.focus();
            };

            const deleteRecord = (id) => {
                if(window.confirm('이 식단 기록을 삭제하시겠습니까?')) {
                    setRecords(records.filter(r => r.id !== id));
                }
            };

            // --- 식단 기반 혈당 개선 조언(AI 분석) ---
            const runAnalysis = () => {
                const todayRecords = records.filter(r => r.date === new Date().toLocaleDateString());

                if (todayRecords.length === 0) {
                    setChatMessages([...chatMessages, { sender: 'user', text: '오늘 내 식단 어때?' }, { sender: 'ai', text: "오늘 기록된 식단이 없습니다. 홈 화면에서 먼저 식단을 기록해주세요!" }]);
                    setCurrentTab('chat');
                    return;
                }

                let feedback = "오늘 드신 식단들을 살펴봤어요! 🍽️\n\n";

                todayRecords.forEach(r => {
                    let isBad = foodDB.bad.some(b => r.value.includes(b));
                    let isGood = foodDB.good.some(g => r.value.includes(g));

                    if (isBad) {
                        feedback += `[${r.mealType}] ${r.value} ⚠️\n혈당을 빠르게 올릴 수 있는 음식이에요. 인슐린 저항성을 높일 수 있으니, 다음 식사때는 식이섬유가 풍부한 채소류를 먼저 섭취하는 걸 추천드려요.\n\n`;
                    } else if (isGood) {
                        feedback += `[${r.mealType}] ${r.value} ✅\n혈당 방어와 안정화에 아주 좋은 선택입니다! 이렇게 관리하시면 혈당 다이어트에도 큰 도움이 됩니다. 훌륭해요!\n\n`;
                    } else {
                        feedback += `[${r.mealType}] ${r.value} 🍽️\n무난한 식단입니다. 과식하지 않도록 양 조절에만 신경 써주시면 완벽해요.\n\n`;
                    }
                });

                feedback += "식단 관리하시면서 유혹을 참기 힘들거나, 특정 음식이 혈당에 어떨지 궁금하시다면 언제든 편하게 물어보세요!";

                setChatMessages([...chatMessages, { sender: 'user', text: '오늘 내 식단 분석해줘' }, { sender: 'ai', text: feedback.trim() }]);
                setCurrentTab('chat');
            };

            // --- 채팅 로직 (식단 감성 피드백 특화) ---
            const handleChatSubmit = (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;

                const userText = chatInput.trim();
                setChatMessages(prev => [...prev, { sender: 'user', text: userText }]);
                setChatInput('');

                setTimeout(() => {
                    let aiResponse = "기록을 꼼꼼히 하시는 모습이 정말 멋져요. 다른 궁금한 음식이나 힘든 점이 있다면 편하게 이야기해주세요.";
                    
                    if(userText.includes('힘들') || userText.includes('스트레스') || userText.includes('포기') || userText.includes('짜증')) {
                        aiResponse = "매 끼니 식단을 관리하고 신경 쓰는 건 정말 고되고 스트레스 받는 일이에요. 완벽하려고 너무 자책하지 마세요. 오늘 하루쯤은 스스로를 다독이며 평소 좋아하시던 음식을 조금 드셔도 괜찮습니다. 지치지 않고 길게 가는 게 가장 중요하니까요!";
                    } else if(userText.includes('배고') || userText.includes('출출') || userText.includes('야식') || userText.includes('먹고싶')) {
                        aiResponse = "정말 참기 힘드시군요! 그럴 땐 무작정 참기보다는 혈당을 급격히 올리지 않는 오이, 토마토, 혹은 구운 계란 1개 정도를 천천히 드시는 걸 추천해요. 따뜻한 허브티 한 잔도 식욕을 달래는 데 큰 도움이 됩니다.";
                    } else if(userText.includes('어때') || userText.includes('괜찮')) {
                        aiResponse = "음식에 따라 다르지만, 가공되지 않은 자연식품 위주라면 대부분 괜찮습니다! 정제 탄수화물(밀가루, 흰쌀)이나 당류가 많이 포함된 음식만 주의하시면 충분히 잘하고 계신 거예요.";
                    }
                    setChatMessages(prev => [...prev, { sender: 'ai', text: aiResponse }]);
                }, 800);
            };

            // --- 마이페이지 데이터베이스 관리 ---
            const addFood = (type, e) => {
                e.preventDefault();
                if (type === 'good' && newGood) { setFoodDB({...foodDB, good: [...foodDB.good, newGood]}); setNewGood(''); }
                if (type === 'bad' && newBad) { setFoodDB({...foodDB, bad: [...foodDB.bad, newBad]}); setNewBad(''); }
            };
            const deleteFood = (type, foodToDelete) => {
                if (type === 'good') setFoodDB({...foodDB, good: foodDB.good.filter(f => f !== foodToDelete)});
                if (type === 'bad') setFoodDB({...foodDB, bad: foodDB.bad.filter(f => f !== foodToDelete)});
            };

            // --- 화면 렌더링 ---
            const renderHomeTab = () => (
                <div className="tab-content p-6 overflow-y-auto">
                    <header className="mb-8 pt-4 flex justify-between items-start">
                        <div>
                            <h1 className="font-display text-6xl uppercase tracking-tight text-ink leading-none">Blood Sugar<br/>Thief</h1>
                            <p className="text-mute mt-2 font-medium">끼니별 식단 기록 및 AI 관리 코치</p>
                        </div>
                    </header>

                    <div className="mb-10">
                        <div className="mb-4">
                            <label className="text-sm font-bold text-ink mb-3 block">어느 끼니인가요?</label>
                            <div className="flex flex-wrap gap-2">
                                {MEAL_TYPES.map(meal => (
                                    <button 
                                        key={meal} 
                                        type="button" 
                                        onClick={() => { setMealType(meal); if(inputRef.current) inputRef.current.focus(); }}
                                        className={`px-4 py-2.5 rounded-full text-sm font-medium transition-colors ${mealType === meal ? 'bg-ink text-canvas shadow-md' : 'bg-canvas border border-hairline text-mute hover:border-ink hover:text-ink'}`}
                                    >
                                        {meal}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        <form onSubmit={handleAddRecord} className="space-y-4">
                            <input 
                                ref={inputRef}
                                type="text" 
                                placeholder="섭취한 음식 입력 (예: 닭가슴살 샐러드)" 
                                value={inputValue} 
                                onChange={e => setInputValue(e.target.value)} 
                                required
                                className="w-full bg-soft-cloud text-ink font-medium text-lg px-6 py-4 rounded-full outline-none focus:ring-2 focus:ring-hairline" 
                            />
                            <button type="submit" className="w-full bg-ink text-canvas font-medium text-lg px-8 py-4 rounded-full btn-press">식단 기록하기</button>
                        </form>
                    </div>

                    <div className="mb-10">
                        <h2 className="text-2xl font-medium text-ink mb-6">오늘의 식사 타임라인</h2>
                        <div className="space-y-0 border-t border-hairline">
                            {records.filter(r => r.date === new Date().toLocaleDateString()).length === 0 ? 
                             <p className="text-mute py-6 text-center">아직 기록된 식단이 없습니다.</p> : 
                             records.filter(r => r.date === new Date().toLocaleDateString()).map(r => (
                                <div key={r.id} className="flex justify-between items-center py-4 border-b border-hairline group">
                                    <div className="flex-1">
                                        <span className="text-[13px] bg-soft-cloud px-3 py-1 rounded-full font-bold text-ink mr-3 inline-block w-20 text-center">{r.mealType}</span>
                                        <span className="font-medium text-ink text-[17px]">{r.value}</span>
                                    </div>
                                    <div className="flex space-x-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity ml-2">
                                        <button onClick={() => editRecord(r)} className="text-[13px] bg-canvas border border-hairline text-ink font-medium px-3 py-1.5 rounded-full hover:bg-soft-cloud whitespace-nowrap">수정</button>
                                        <button onClick={() => deleteRecord(r.id)} className="text-[13px] bg-sale/10 text-sale font-medium px-3 py-1.5 rounded-full hover:bg-sale hover:text-canvas whitespace-nowrap">삭제</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="pb-6">
                        <button onClick={runAnalysis} className="w-full bg-ink text-canvas font-medium text-lg px-4 py-4 rounded-full btn-press">AI 식단 분석받기</button>
                    </div>
                </div>
            );

            const renderChatTab = () => (
                <div className="tab-content relative bg-soft-cloud flex flex-col" style={{ height: 'calc(100vh - 70px)' }}>
                    <div className="bg-canvas p-6 border-b border-hairline-soft sticky top-0 z-10 flex justify-between items-center">
                        <h2 className="text-2xl font-medium text-ink">AI 식단 코치</h2>
                    </div>
                    
                    <div className="flex-1 p-6 overflow-y-auto space-y-6 chat-scroll pb-24">
                        {chatMessages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`px-5 py-4 rounded-[24px] max-w-[85%] whitespace-pre-wrap font-medium leading-relaxed text-[15px] ${msg.sender === 'user' ? 'bg-ink text-canvas rounded-br-sm' : 'bg-canvas text-ink border border-hairline-soft rounded-bl-sm shadow-sm'}`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>

                    <form onSubmit={handleChatSubmit} className="absolute bottom-0 left-0 w-full p-4 bg-canvas border-t border-hairline-soft flex items-center space-x-2 z-20">
                        <input 
                            type="text" 
                            value={chatInput} 
                            onChange={(e) => setChatInput(e.target.value)} 
                            placeholder="식단에 대한 고민을 편하게 물어보세요..." 
                            className="flex-1 bg-soft-cloud text-ink px-6 py-3 rounded-full outline-none font-medium placeholder-mute focus:ring-2 focus:ring-hairline-soft"
                        />
                        <button type="submit" className="bg-ink text-canvas p-3 rounded-full flex items-center justify-center btn-press">
                            <SendIcon />
                        </button>
                    </form>
                </div>
            );

            const renderMyPageTab = () => (
                <div className="tab-content p-6 overflow-y-auto">
                    <header className="mb-8 pt-4">
                        <h2 className="font-display text-5xl uppercase tracking-tight text-ink mb-2">My Profile</h2>
                        <p className="text-sm font-medium text-mute">개인정보 및 식품 DB 관리</p>
                    </header>
                    
                    <div className="space-y-6 mb-12">
                        <h3 className="text-xl font-medium text-ink border-b border-hairline pb-3">신체 정보</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-sm font-bold text-mute ml-2">나이</label><input type="number" value={profile.age} onChange={e=>setProfile({...profile, age: e.target.value})} className="w-full bg-soft-cloud text-ink font-medium px-4 py-3 rounded-md outline-none mt-1" /></div>
                            <div><label className="text-sm font-bold text-mute ml-2">키 (cm)</label><input type="number" value={profile.height} onChange={e=>setProfile({...profile, height: e.target.value})} className="w-full bg-soft-cloud text-ink font-medium px-4 py-3 rounded-md outline-none mt-1" /></div>
                            <div><label className="text-sm font-bold text-mute ml-2">목표 체중 (kg)</label><input type="number" value={profile.weight} placeholder="입력" onChange={e=>setProfile({...profile, weight: e.target.value})} className="w-full bg-soft-cloud text-ink font-medium px-4 py-3 rounded-md outline-none mt-1" /></div>
                        </div>
                    </div>

                    <div className="space-y-8 pb-10">
                        <h3 className="text-xl font-medium text-ink border-b border-hairline pb-3">식품 데이터베이스 관리</h3>
                        
                        <div>
                            <h4 className="font-medium text-success mb-3 flex items-center text-[15px]">🟢 혈당 개선(안정화) 식품</h4>
                            <div className="flex flex-wrap gap-2 mb-4">
                                {foodDB.good.map((food, i) => (
                                    <span key={i} onClick={() => deleteFood('good', food)} className="bg-canvas border border-hairline px-3 py-1.5 rounded-full text-[13px] font-medium text-ink cursor-pointer hover:bg-sale hover:text-canvas hover:border-sale transition-colors group">
                                        {food} <span className="text-hairline group-hover:text-canvas ml-1">×</span>
                                    </span>
                                ))}
                            </div>
                            <form onSubmit={(e) => addFood('good', e)} className="flex space-x-2">
                                <input value={newGood} onChange={e=>setNewGood(e.target.value)} placeholder="좋은 식품 직접 추가" className="flex-1 bg-soft-cloud px-5 py-3 rounded-full text-sm outline-none font-medium focus:ring-2 focus:ring-success" />
                                <button type="submit" className="bg-ink text-canvas px-6 rounded-full text-sm font-medium btn-press">추가</button>
                            </form>
                        </div>

                        <div>
                            <h4 className="font-medium text-sale mb-3 flex items-center text-[15px]">🔴 주의해야 할 식품</h4>
                            <div className="flex flex-wrap gap-2 mb-4">
                                {foodDB.bad.map((food, i) => (
                                    <span key={i} onClick={() => deleteFood('bad', food)} className="bg-canvas border border-hairline px-3 py-1.5 rounded-full text-[13px] font-medium text-ink cursor-pointer hover:bg-sale hover:text-canvas hover:border-sale transition-colors group">
                                        {food} <span className="text-hairline group-hover:text-canvas ml-1">×</span>
                                    </span>
                                ))}
                            </div>
                            <form onSubmit={(e) => addFood('bad', e)} className="flex space-x-2">
                                <input value={newBad} onChange={e=>setNewBad(e.target.value)} placeholder="주의 식품 직접 추가" className="flex-1 bg-soft-cloud px-5 py-3 rounded-full text-sm outline-none font-medium focus:ring-2 focus:ring-sale" />
                                <button type="submit" className="bg-ink text-canvas px-6 rounded-full text-sm font-medium btn-press">추가</button>
                            </form>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="app-container">
                    <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 bg-ink text-canvas text-xs font-bold px-4 py-2 rounded-full flex items-center space-x-2 transition-opacity duration-300 z-50 shadow-lg ${saveToast ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        <SaveIcon />
                        <span>데이터 클라우드 자동 저장됨</span>
                    </div>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        {currentTab === 'home' && renderHomeTab()}
                        {currentTab === 'chat' && renderChatTab()}
                        {currentTab === 'mypage' && renderMyPageTab()}
                    </main>

                    <nav className="absolute bottom-0 w-full max-w-[768px] bg-canvas border-t border-hairline-soft flex justify-around items-center h-[70px] z-50">
                        <button onClick={() => setCurrentTab('home')} className={`flex flex-col items-center justify-center w-full h-full ${currentTab === 'home' ? 'text-ink' : 'text-mute hover:text-ink'}`}>
                            <HomeIcon />
                            <span className="text-[10px] font-bold mt-1 uppercase">Home</span>
                        </button>
                        <button onClick={() => setCurrentTab('chat')} className={`flex flex-col items-center justify-center w-full h-full ${currentTab === 'chat' ? 'text-ink' : 'text-mute hover:text-ink'}`}>
                            <ChatIcon />
                            <span className="text-[10px] font-bold mt-1 uppercase">AI Chat</span>
                        </button>
                        <button onClick={() => setCurrentTab('mypage')} className={`flex flex-col items-center justify-center w-full h-full ${currentTab === 'mypage' ? 'text-ink' : 'text-mute hover:text-ink'}`}>
                            <UserIcon />
                            <span className="text-[10px] font-bold mt-1 uppercase">My Page</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
